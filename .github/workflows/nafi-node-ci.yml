name: Nafi Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: mysql
          MYSQL_USER: nafi
          MYSQL_PASSWORD: nafi-test-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -unaﬁ -pnafi-test-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          test -f nafi-node-foundation.zip
          unzip -o nafi-node-foundation.zip -d .
          test -f nafi-node/package.json
          test -f nafi-node/package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nafi-node/package-lock.json

      - name: Wait for MySQL and grant test database permissions
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password --silent; then
              break
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot -proot-test-password -e "GRANT ALL PRIVILEGES ON *.* TO 'nafi'@'%'; FLUSH PRIVILEGES;"

      - name: Install dependencies
        working-directory: nafi-node
        run: npm ci

      - name: Run tests
        working-directory: nafi-node
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: nafi
          DB_USER: nafi
          DB_PASS: nafi-test-pass
          APP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: npm test -- --run

      - name: Build
        working-directory: nafi-node
        run: npm run build --if-present
