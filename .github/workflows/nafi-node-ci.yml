name: Nafi Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract project archive
        run: unzip -o nafi-node-foundation.zip -d .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nafi-node/package-lock.json
      - name: Install dependencies
        working-directory: nafi-node
        run: npm ci
      - name: Run tests
        working-directory: nafi-node
        run: npm run test --if-present -- --run
      - name: Build
        working-directory: nafi-node
        run: npm run build --if-present
