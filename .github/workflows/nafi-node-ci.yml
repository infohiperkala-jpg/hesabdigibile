name: Nafi Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          test -f nafi-node-foundation.zip
          unzip -o nafi-node-foundation.zip -d .
          test -f nafi-node/package.json
          test -f nafi-node/package-lock.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nafi-node/package-lock.json

      - name: Inspect test database configuration
        working-directory: nafi-node
        run: |
          echo '--- .env.example ---'
          cat .env.example
          echo '--- src/core/env.ts ---'
          sed -n '1,240p' src/core/env.ts
          echo '--- src/core/db.ts ---'
          sed -n '1,180p' src/core/db.ts
          echo '--- tests/helpers.ts ---'
          sed -n '1,100p' tests/helpers.ts

      - name: Install dependencies
        working-directory: nafi-node
        run: npm ci

      - name: Run tests
        working-directory: nafi-node
        run: npm test -- --run

      - name: Build
        working-directory: nafi-node
        run: npm run build --if-present
